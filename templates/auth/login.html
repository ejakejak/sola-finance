{% extends "base.html" %}
{% block title %}Login — SOLA Finance{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:60px auto">
<h2>Login (design spec auth — role selection for P0 verification)</h2>
<form method="post" action="/login">
<div class="form-row"><label>Username</label><input name="username" value="finance@sola.id"></div>
<div class="form-row"><label>Password (any — no auth gate for P0 build test)</label><input name="password" type="password" value="x"></div>
<div class="form-row"><button>Login</button></div>
</form>
<p style="font-size:12px;color:var(--muted)">Quick switches: <a href="/set_role/Finance">Finance</a> · <a href="/set_role/Non-Finance">Non-Finance</a> · <a href="/set_role/Customer">Customer</a></p>
</div>
{% endblock %}
